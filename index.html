<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes API Client</h1>
    <p>Talking to the JSONPlaceholder practice API.</p>
  </header>

  <main>
    <section>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status"></p>
    </section>

    <section>
      <h2>Create a note</h2>
      <form id="note-form">
        <label for="title-input">Title</label>
        <input type="text" id="title-input" placeholder="Required, 100 characters maximum">

        <label for="body-input">Body</label>
        <textarea id="body-input" rows="4" placeholder="Optional"></textarea>

        <button type="submit" id="submit-btn">Add note</button>
      </form>
    </section>

    <section>
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
